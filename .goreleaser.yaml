version: 2

project_name: gophkeeper

builds:
  - id: client
    main: ./cmd/client
    binary: gophkeeper
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/ilushka-off/GophKeeper/internal/buildinfo.Version={{.Version}}
      - -X github.com/ilushka-off/GophKeeper/internal/buildinfo.Date={{.Date}}
      - -X github.com/ilushka-off/GophKeeper/internal/buildinfo.Commit={{.ShortCommit}}
  - id: server
    main: ./cmd/server
    binary: gophkeeper-server
    env:
      - CGO_ENABLED=0
    goos: [linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/ilushka-off/GophKeeper/internal/buildinfo.Version={{.Version}}
      - -X github.com/ilushka-off/GophKeeper/internal/buildinfo.Date={{.Date}}
      - -X github.com/ilushka-off/GophKeeper/internal/buildinfo.Commit={{.ShortCommit}}

archives:
  - id: client
    ids: [client]
    name_template: "gophkeeper_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: server
    ids: [server]
    name_template: "gophkeeper-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
