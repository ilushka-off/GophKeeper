syntax = "proto3";

package gophkeeper.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/ilushka-off/GophKeeper/api/gen/gophkeeper/v1;gophkeeperv1";

// RecordType is the kind of private data stored in a record.
// The server sees only the type, the payload itself is encrypted on the client.
enum RecordType {
  RECORD_TYPE_UNSPECIFIED = 0;
  RECORD_TYPE_CREDENTIALS = 1;
  RECORD_TYPE_TEXT = 2;
  RECORD_TYPE_BINARY = 3;
  RECORD_TYPE_CARD = 4;
}

// Record is an encrypted user record as it is stored on the server.
message Record {
  // UUID generated by the client.
  string id = 1;
  RecordType type = 2;
  // Ciphertext: AES-256-GCM of the serialized payload (data + metadata).
  bytes payload = 3;
  // Version grows on every change of the record.
  int64 version = 4;
  // Revision of the user's change counter at the time of the last change.
  int64 revision = 5;
  // Deleted marks a tombstone.
  bool deleted = 6;
  google.protobuf.Timestamp updated_at = 7;
}
