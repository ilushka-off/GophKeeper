syntax = "proto3";

package gophkeeper.v1;

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/ilushka-off/GophKeeper/api/gen/gophkeeper/v1;gophkeeperv1";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
  info: {
    title: "GophKeeper API"
    version: "1.0"
    description: "REST view of the GophKeeper gRPC API. Record payloads and blobs are encrypted on the client, the server never sees them in plaintext. Bytes fields are base64 in JSON. UploadBlob is available only over gRPC."
  }
  schemes: HTTPS
  consumes: "application/json"
  produces: "application/json"
  security_definitions: {
    security: {
      key: "Bearer"
      value: {
        type: TYPE_API_KEY
        in: IN_HEADER
        name: "Authorization"
        description: "Access token in the form \"Bearer <token>\""
      }
    }
  }
  security: {
    security_requirement: {
      key: "Bearer"
      value: {}
    }
  }
};

// AuthService registers and authenticates users.
service AuthService {
  // Register creates a user and returns a token pair.
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/register"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {security: {}};
  }
  // GetSalt returns the KDF salt the client needs to derive keys before Login.
  rpc GetSalt(GetSaltRequest) returns (GetSaltResponse) {
    option (google.api.http) = {get: "/api/v1/auth/salt/{login}"};
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {security: {}};
  }
  // Login checks the login password and returns a token pair.
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/login"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {security: {}};
  }
  // Refresh exchanges a refresh token for a new token pair.
  rpc Refresh(RefreshRequest) returns (RefreshResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/refresh"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {security: {}};
  }
  // Logout revokes a refresh token.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (google.api.http) = {
      post: "/api/v1/auth/logout"
      body: "*"
    };
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {security: {}};
  }
}

// Tokens is a pair of access and refresh tokens.
message Tokens {
  string access_token = 1;
  string refresh_token = 2;
  google.protobuf.Timestamp access_expires_at = 3;
}

message RegisterRequest {
  string login = 1;
  // Login password derived from the master password on the client.
  string password = 2;
  // Salt used by the client to derive keys from the master password.
  bytes kdf_salt = 3;
}

message RegisterResponse {
  Tokens tokens = 1;
  bytes kdf_salt = 2;
}

message GetSaltRequest {
  string login = 1;
}

message GetSaltResponse {
  bytes kdf_salt = 1;
}

message LoginRequest {
  string login = 1;
  string password = 2;
}

message LoginResponse {
  Tokens tokens = 1;
  bytes kdf_salt = 2;
}

message RefreshRequest {
  string refresh_token = 1;
}

message RefreshResponse {
  Tokens tokens = 1;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {}
